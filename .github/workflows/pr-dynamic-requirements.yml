name: PR Dynamic Requirements

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  build-requirements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read PR body & mapping, build requirements markdown
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('yaml');
            const body = context.payload.pull_request.body || "";
            const map = yaml.parse(fs.readFileSync('.github/pr-requirements.yml','utf8'));
            // 1) extraire les cases cochées: "- [x] key"
            const checked = [...body.matchAll(/^- \[x\]\s+([a-z0-9:-]+)/gmi)].map(m=>m[1]);
            // 2) construire la section
            let sections = [];
            for (const key of checked) {
              if (!map[key]) continue;
              const { title, items = [], docs = [] } = map[key];
              const itemsMd = items.map(i => `- [ ] ${i}`).join('\n');
              const docsMd  = docs.map(d => `- ${d}`).join('\n');
              sections.push(`### ${title}\n${itemsMd}\n\n**Docs**\n${docsMd}`);
            }
            const requirements = sections.length
              ? `## Requirements\n${sections.join('\n\n')}`
              : `## Requirements\n_Aucune case cochée._`;

            // 3) remplace la zone balisée
            const start = '<!-- REQUIREMENTS:START -->';
            const end   = '<!-- REQUIREMENTS:END -->';
            const before = body.split(start)[0] + start + '\n';
            const after  = '\n' + end + (body.split(end)[1] ?? '');
            const newBody = before + requirements + after;

            core.setOutput('newBody', newBody);

      - name: Update PR body
        if: steps.build.outputs.newBody != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: `${{ steps.build.outputs.newBody }}`
            });

      - name: Fail if DB change without tests
        if: contains(steps.build.outputs.newBody, 'Database changes') && !contains(steps.build.outputs.newBody, 'Unit tests')
        run: |
          echo "DB change requires unit tests selection."
          exit 1

      - name: Apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const labels = [];
            if (/- \[x\]\s+feature:ui/i.test(body)) labels.push('area:ui');
            if (/- \[x\]\s+feature:api/i.test(body)) labels.push('area:api');
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels
              });
            }
